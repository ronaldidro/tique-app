name: CI/CD pipeline

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Use Node 16
        uses: actions/setup-node@v3
        with:
          node-version: 16.x

      - name: Start Mongo DB
        uses: supercharge/mongodb-github-action@1.8.0
        with:
          mongodb-version: 6.x

      - name: Install packages
        run: npm ci

      - name: Check rules
        run: npm run lint

      - name: Backend testing
        run: npm run test:backend
