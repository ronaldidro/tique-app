name: CI/CD pipeline

env:
  TEST_MONGODB_URI: 'mongodb+srv://tique:tique@cluster0.8m1fv.mongodb.net/tique-bd-test?retryWrites=true&w=majority'
  SECRET: 'tiqueapp'

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Use Node 16
        uses: actions/setup-node@v3
        with:
          node-version: 16.x

      - name: Install packages
        run: npm install

      - name: Check rules
        run: npm run lint

      - name: Backend testing
        # run: npm run test:backend
        run: npm run test:backend -- api/test/order_api.test.js
