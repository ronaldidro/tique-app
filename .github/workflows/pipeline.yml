name: CI/CD pipeline

on:
  push:
    branches: [main]

env:
  TEST_MONGODB_URI: ${{ secrets.TEST_URI }}
  SECRET: ${{ secrets.SECRET_KEY }}

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Use Node 16
        uses: actions/setup-node@v3
        with:
          node-version: 16.x

      - name: Install packages
        run: npm install

      - name: Check rules
        run: npm run lint

      - name: Backend testing
        run: npm run test:backend
